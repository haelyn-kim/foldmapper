# FoldMapper default variant: d_s1 = 256, no BLOSUM62 bias.

# Stage 1 (evolutionary encoder)
s1_hidden_dim: 256
s1_edge_features: 128
s1_num_encoder_layers: 3
s1_k_neighbors: 30
s1_augment_eps: 0.1

# Stage 2 (structure-conditioned MPNN)
hidden_dim: 512
num_encoder_layers: 3
num_decoder_layers: 3
num_neighbors: 48
backbone_noise: 0.2

# Regularisation
dropout: 0.1
profile_dropout: 0.1

# BLOSUM62 (off)
use_blosum: false

# Training defaults
num_epochs: 200
batch_size: 2000
num_examples_per_epoch: 30000
reload_data_every_n_epochs: 1
save_model_every_n_epochs: 20
gradient_norm: 0.5
rescut: 3.5
mixed_precision: true
